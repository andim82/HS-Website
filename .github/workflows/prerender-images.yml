name: Prerender - Hero Images to WebP

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

jobs:
  prerender-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run prerender-images.mjs
        run: node scripts/prerender-images.mjs
        env:
          WP_BASE_URL: https://heimspiel.de

      - name: Upload mapping artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-mapping
          path: output/image-mapping.json

      - name: Commit und Push generierte Bilder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/hero-images
          if git diff --cached --quiet; then
            echo "Keine Aenderungen an dist/hero-images, nichts zu committen."
          else
            git commit -m "Auto: neue Hero-Images (WebP) via Prerender-Workflow"
            git push
          fi
