# Test-Workflow: Prueft, ob POST-Requests vom GitHub-Actions-Runner an
# /wp-json/hs-prerender/v1/snapshot durch dieselbe Hosting-Firewall blockiert
# werden wie frueher /prerender/media (siehe Changelog v1.4 in
# heimspiel-data-cache.php -- 401 rest_forbidden bei authentifizierten
# POST-Requests aus GitHub-Actions-IP-Bereichen).
#
# Einbau: Im Repo unter Settings -> Secrets and variables -> Actions ein
# neues Secret anlegen: HS_SNAPSHOT_API_KEY (Wert = derselbe Schluessel,
# den du bereits lokal in PowerShell als X-HS-Snapshot-Key getestet hast).
#
# Start: Im Reiter "Actions" den Workflow "Test Prerender Snapshot Firewall"
# auswaehlen und ueber "Run workflow" manuell anstossen.

name: Test Prerender Snapshot Firewall

on:
  workflow_dispatch: {}

jobs:
  test-snapshot-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: POST an /wp-json/hs-prerender/v1/snapshot senden
        env:
          HS_SNAPSHOT_API_KEY: ${{ secrets.HS_SNAPSHOT_API_KEY }}
        run: |
          echo "Teste Request von GitHub-Actions-Runner an heimspiel.de ..."

          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -X POST "https://heimspiel.de/wp-json/hs-prerender/v1/snapshot" \
            -H "Content-Type: application/json" \
            -H "X-HS-Snapshot-Key: ${HS_SNAPSHOT_API_KEY}" \
            -d '{"url":"https://heimspiel.de/winter-sports","html":"<p>GitHub Actions Firewall-Test</p>"}')

          echo "HTTP-Status: ${HTTP_STATUS}"
          echo "Antwort-Body:"
          cat response.json
          echo ""

          if [ "$HTTP_STATUS" = "401" ] || [ "$HTTP_STATUS" = "403" ]; then
            echo "::error::Vermutlich Firewall-Blockade (HTTP ${HTTP_STATUS}) -- dieselbe Ursache wie bei /prerender/media in v1.3."
            exit 1
          elif [ "$HTTP_STATUS" = "404" ]; then
            echo "::error::rest_no_route oder unbekannte URL -- Route nicht erreichbar oder falscher Pfad."
            exit 1
          elif [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "OK: Kein Firewall-Problem erkennbar, Request kam durch."
          else
            echo "::warning::Unerwarteter Status ${HTTP_STATUS} -- Antwort-Body oben pruefen."
          fi
